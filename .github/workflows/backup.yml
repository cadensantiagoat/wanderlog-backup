name: Daily Wanderlog Backup

on:
  schedule:
    # Runs automatically every day at 06:00 UTC (1:00 AM EST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Enables a manual trigger button in GitHub

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruct Credentials File
        env:
          GOOGLE_CRED_DATA: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          echo "$GOOGLE_CRED_DATA" > credentials.json

      - name: Execute Backup Script
        env:
          WANDERLOG_AUTH: ${{ secrets.WANDERLOG_AUTH }}
          WANDERLOG_TRIP_ID: ${{ secrets.WANDERLOG_TRIP_ID }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: python backup.py